version: "1"

scope:
  include_public: true
  include_private: false
  include_archived: false
  include_forked: false
  # include_repos restricts the scan to only these repos; overrides all other scope filters.
  # Exact names and glob patterns are both supported.
  include_repos:
    - api
  #   - web-*
  # exclude_repos:         # Glob patterns supported
  #   - sandbox
  #   - legacy-*

# include_rules restricts the scan to rules whose IDs match at least one glob pattern.
# When set, exclude_rules is ignored.
# include_rules:
#   - secret-*
#   - branch-protection

# exclude_rules removes rules whose IDs match any glob pattern from the scan.
# Useful for ad-hoc filtering without editing individual rule entries.
# exclude_rules:
#   - harden-runner-required
#   - generic-secret-assignment

output:
  format: table      # table | json | csv | sarif
  # path: results.sarif

# remediation:
#   enabled: false            # master switch — nothing runs unless true. Each rule opts in individually via its own auto_remediation field.
#   branch_prefix: "git-cascade/fix"
#   pr_labels:
#     - automated-fix

notify:
  slack:
    enabled: false
    # --- Delivery method (choose one) ---
    # Webhook (simplest): one URL posts to a single fixed channel.
    # webhook_url: https://hooks.slack.com/services/xxx  # prefer GIT_CASCADE_SLACK_WEBHOOK env var
    #
    # Bot token (flexible): supports per-channel routing via repository_channels.
    # bot_token: xoxb-...  # prefer GIT_CASCADE_SLACK_BOT_TOKEN env var
    #
    # --- Default channel ---
    # channel: "#compliance"  # fallback for repos not listed in repository_channels
    #
    # --- Per-repo channel routing (requires bot_token) ---
    # repository_channels:
    #   - channels: "#ops, #security"
    #     repositories: "api, backend"
    #   - channels: "#frontend"
    #     repositories: "web, dashboard"
    #
    # results_url is a runtime value — use --slack-results-url flag or GIT_CASCADE_SLACK_RESULTS_URL env var
  issues:
    enabled: false
    mode: compliance   # compliance (one consolidated issue) | repo (one issue per failing repo) | append (comment on a shared issue)
    # compliance_repo: myorg/compliance  # defaults to <org>/compliance; also used as the shared-issue repo for mode=append
    #
    # --- mode=compliance only ---
    # header_text: "# My Custom Report"  # overrides the default "# Compliance Report — {org}" heading
    #
    # --- mode=append only ---
    # issue_title: "Integrated Findings"  # title of the shared issue to upsert a comment on; created if missing
    # section_key: myorg-backend          # identifies this config's comment on the shared issue; defaults to org
    labels:
      - compliance
      - automated
